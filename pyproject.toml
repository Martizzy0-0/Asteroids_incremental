[project]
name = "asteroidal"
version = "0.1.0"
description = "incremental Asteroids game"
readme = "README.md"
authors = [
    { name = "Martizzy0-0", email = "martin_rch@protonmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pygame-ce>=2.5.8",
]

[project.scripts]
asteroidal = "asteroidal:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
